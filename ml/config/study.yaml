# HCMAN Women's CVD cohort study — run configuration for Mayo Clinic Platform (MCP).
# Every value here is read by mcp_adapter.config.StudyConfig. Change values, not code.

platform:
  dialect: spark                 # spark (MCP workbench) | duckdb (local synthetic tests)
  cdm_schema: omop_cdm           # OMOP CDM schema name — confirm in MCP Schema Visualizer
  vocab_schema: omop_cdm         # where CONCEPT / CONCEPT_ANCESTOR live (often same schema)
  results_schema: hcman_results  # writable scratch schema for cohort tables, if MCP grants one
  # Imaging is CONFIRMED available under the Cardio AI MCP contract and is REQUIRED for this
  # study (imaging_required: true). Fill in where MCP exposes it — ask the MCP mentor for the
  # table or bucket names; the rest of the pipeline does not change.
  imaging_required: true
  # DICOM files are not in a table: each instance is catalogued in FACT_RADIOLOGY_DICOM_INVENTORY
  # and must be requested (MCP, 15 Oct 2026). Column names below are from the MCP Radiology deck.
  # `python -m mcp_adapter.imaging_sources request` builds the study-level request list.
  dicom_inventory:
    table: FACT_RADIOLOGY_DICOM_INVENTORY   # TODO(MCP): add the schema prefix if needed
    patient_column: PATIENT_CLINIC_NUMBER   # Mayo clinic number, mapped to OMOP via person_map below
    patient_dk_column: PATIENT_DK           # required in the de-identification submission CSV
    study_uid_column: STUDY_INSTANCE_UID
    series_uid_column: SERIES_INSTANCE_UID
    accession_column: DICOM_ACCESSION_NUMBER   # = FACT_RADIOLOGY.ACCESSION_NBR
    modality_column: MODALITY
    stmo_column: STMO_NAME_IN_ADL           # storage segment; part of the join key to other tables
    description_column: STUDY_DESCRIPTION
    deid_status_column: IMAGE_DEID_STATUS
    deid_ok: [Ready, Available]             # only these can be submitted for de-identification
    modalities: [US]                        # US = echo (also obstetric, vascular... filtered below)
    description_pattern: "ECHO|TTE|TRANSTHORACIC|CARDIAC|HEART"
    window_days: [-30, 2]                   # study date relative to a cardiac evaluation
    keep_undated: true                      # echo is itself a cardiac evaluation: keep studies
                                            #   whose date cannot be found rather than drop them
    # The inventory has no study date. Take it from FACT_RADIOLOGY via the accession number
    # (radiology-read studies); echo studies without a radiology report stay undated.
    date_source: fact_radiology             # fact_radiology | inventory | none
    date_table: FACT_RADIOLOGY              # TODO(MCP): add the schema prefix if needed
    date_accession_column: ACCESSION_NBR
    date_column: RADIOLOGY_DTM              # when the imaging was performed (not RADIOLOGY_REVIEW_DTM)
  # Mayo-native tables key patients by PATIENT_CLINIC_NUMBER; OMOP uses person_id. This is the
  # OMOP person column holding the (de-identified) clinic number.
  person_map:
    clinic_number_column: person_source_value   # TODO(MCP): confirm this mapping
  # Mayo patient dimension: one row per PATIENT_DK (per medical-record system). PATIENT_CLINIC_NUMBER
  # is the same person across systems (MCP, 21 Oct 2026), so it is the person-level key; one row
  # per person is PATIENT_MERGED_FLAG = 'N'.
  dim_patient:
    table: DIM_PATIENT               # TODO(MCP): add the schema prefix if needed
    dk_column: PATIENT_DK
    clinic_number_column: PATIENT_CLINIC_NUMBER
    merged_flag_column: PATIENT_MERGED_FLAG
    merged_flag_current: "N"
  # ECG waveforms are encoded strings in FACT_ECG_WAVEFORM (MCP, 21 Oct 2026): one URL-encoded
  # Base64 record per lead, signed 16-bit little-endian counts x 4.88 = microvolts; leads I, II,
  # V1-V6 (III, aVR, aVL, aVF are derived); WAVEFORM_TYPE 'Rhythm' = the full 10 s (not 'Median').
  # Records are not ordered chunks, so they are never concatenated. Sampling rate (250 or 500 Hz)
  # from FACT_ECG_WAVEFORM_RESTING_MEASUREMENT.ECGSAMPLEBASE. To join FACT_ECG (measurements,
  # interpretation): PATIENT_DK via DIM_PATIENT, ACQUISITION_TS = ECG_DTM.
  # `python -m mcp_adapter.imaging_sources ecg` converts them to files + a manifest.
  ecg_table:
    table: FACT_ECG_WAVEFORM         # TODO(MCP): add the schema prefix if needed
    format: mayo_waveform            # mayo_waveform | muse_xml | lead_base64
    person_column: PATIENT_DK        # joined to DIM_PATIENT, then to OMOP through person_map
    date_column: ACQUISITION_TS      # one acquisition = PATIENT_DK + ACQUISITION_TS
    waveform_column: WAVEFORM
    lead_column: LEAD_ID
    type_column: WAVEFORM_TYPE
    rhythm_value: Rhythm
    url_encoded: true
    units_per_bit: 4.88              # counts -> microvolts
    sample_rate_table: FACT_ECG_WAVEFORM_RESTING_MEASUREMENT   # TODO(MCP): schema prefix
    sample_rate_column: ECGSAMPLEBASE
    sample_rate_keys: [PATIENT_DK, ACQUISITION_TS]   # TODO(MCP): confirm the join keys
  ecg_source:
    kind: npy_dir                # the .npz files written by `imaging_sources ecg`
    path: null                   # set to the extraction output folder (e.g. $WB/ecg_npz)
    manifest: null               # its manifest.csv
  echo_source:
    kind: dicom_dir              # dicom_dir | npy_dir
    path: null                   # TODO(MCP): root folder of echo DICOM cine files
    manifest: null               # TODO(MCP): "sql:<schema.table>" or file with
                                 #   person_id, record_date, view (PLAX|PSAX|A4C|A2C), path,
                                 #   optional ed_frame, es_frame

study:
  study_start: "2010-01-01"      # de-identified dates are shifted uniformly; windows use relative days only
  study_end: "2025-12-31"
  min_age: 18
  max_age_pregnancy_strata: 55
  lookback_days: 365             # inputs come from [index - lookback, index]
  ecg_echo_window_days: [-30, 2] # nearest ECG / echo to index within this window
  labs_window_days: 90           # stream 5 serial-lab window, ending at index
  label_window_days: 90          # condition labels confirmed within (index, index + 90]
  outcome_window_days: 365       # MACE / postpartum CVD outcomes within (index + blanking, index + 365]
  outcome_blanking_days: 7       # events in days 1-7 belong to the index episode, not future MACE
  min_prior_observation_days: 365
  postpartum_max_days: 182       # "postpartum < 6 months"
  condition_label_rule: two_codes_or_inpatient   # two_codes_or_inpatient | any_code

reports:
  # Free-text clinical reports for chart review (runbook Step 4b). Radiology reports are already
  # in the OMOP NOTE table (MCP Radiology deck), which chart review reads by default, so the
  # FACT_RADIOLOGY source is off to avoid showing each report twice. Echo notes are Mayo-native.
  echo_notes:
    table: FACT_ECHO_TEST          # TODO(MCP): add the schema prefix if needed
    text_column: ECHO_NOTE         # MCP: "Echo Notes are in FACT_ECHO_TEST.ECHO_NOTE"
    person_column: PATIENT_CLINIC_NUMBER   # TODO(MCP): confirm (the Mayo-native patient key)
    person_key: clinic_number      # clinic_number (mapped via platform.person_map) | person_id
    date_column: null              # TODO(MCP): echo date column
  radiology:
    enabled: false                 # already in OMOP NOTE; turn on only if NOTE lacks them
    table: FACT_RADIOLOGY
    text_column: RADIOLOGY_REPORT
    person_column: PATIENT_CLINIC_NUMBER   # TODO(MCP): confirm
    person_key: clinic_number
    date_column: RADIOLOGY_DTM

audit:
  # Two-tier audit of the automatic labels (annotate.audit; runbook Steps 2b and 4b).
  # Tier 1: data scientists audit every item. Tier 2: a cardiologist adjudicates disagreements,
  # uncertain items and a blinded spot-check. Use workspace user names; nobody can be in both lists.
  data_scientists: []              # TODO: e.g. [ds_ana, ds_ben]
  cardiologists: []                # TODO: the outside cardiologist(s) on Cardio AI's annotator seats
  tier1_per_item: 1                # data scientists per item (2 = double audit; their disagreements go to tier 2)
  spot_check_fraction: 0.10        # share of tier-1-accepted items re-labelled blind by the cardiologist
  spot_check_min: 20               # at least this many spot-checks per audit
  spot_check_target: 0.95          # pass when the spot-check agreement's 95% CI lower bound reaches this
  # Optional automatic tier 1 (annotate.auto_audit): checks each label against independent evidence
  # (notes, procedures, reported LVEF; a second view model and phase estimate for echo).
  #   off     - data scientists audit everything
  #   triage  - auto-agreed items count as tier-1 accepted; flagged items go to the data scientists
  #   replace - the automatic auditor is tier 1; flagged items go straight to the cardiologist
  # Start with triage; use replace only after the auto row of report 09d passes its spot-check.
  auto_tier1: "off"
  auto_spot_check_fraction: 0.20   # share of auto-accepted items re-labelled blind (at least spot_check_min)

training:
  # Reviewer training on the SYNTHETIC kit (annotate.synthetic_cases + annotate.training), run on a
  # laptop before workspace access; no patient data. Proposed marks: the clinical lead confirms them.
  lead: null                       # optional: the clinical lead's name; their answers override the generated key
  kit_size:                        # records span the six conditions and three outcome labels
    reference: {records: 40, echo: 40}       # half is qualification attempt 1, half the retake
    practice: {records: 60, echo: 40}
    mock_audit: {records: 72, echo: 24}
  qualification_size: 20           # items per kind per attempt; the marks below are out of this
  pass_marks:
    data_scientist: {echo_view: 18, echo_frames: 17, phenotype: 18, phenotype_max_unsure: 2}
    cardiologist: {echo: 19, phenotype: 19}
    cardiologist_pair_kappa: 0.80

outcomes:
  # Optional MACE rule: count an MI or stroke code only when it is also a PRIMARY diagnosis in Mayo
  # FACT_DIAGNOSIS (PRIMARY_DIAGNOSIS_FLAG; MCP, 21 Oct 2026). It removes history-of and rule-out
  # codes recorded as secondary, but misses real events coded only as secondary. Off by default;
  # the clinical lead decides. Heart failure keeps its inpatient/ED rule; death is all-cause.
  mace_primary_diagnosis:
    mode: "off"                    # off | fact_diagnosis
    table: FACT_DIAGNOSIS          # TODO(MCP): schema prefix
    patient_key: patient_dk        # patient_dk (via dim_patient) | clinic_number
    patient_column: PATIENT_DK     # TODO(MCP): confirm
    date_column: DIAGNOSIS_DTM     # TODO(MCP): the diagnosis date column
    code_column: DIAGNOSIS_CODE    # TODO(MCP): the ICD-10 code column
    flag_column: PRIMARY_DIAGNOSIS_FLAG
    flag_value: "Y"                # TODO(MCP): confirm the value that means primary
    match_days: 1                  # the primary diagnosis must be within this many days of the code
    applies_to: [out_mi, out_stroke]

sampling:
  # Minimum targets from the Model Details Form; the feasibility query decides real N.
  stratum_targets:
    A_pregnant_high_risk: 200
    B_postpartum: 200
    C_scad_fmd: 200
    D_postmeno_takotsubo_cmd: 250
    E_pcos_endo_autoimmune: 200
    F_prior_preeclampsia: 150
  take_all_available: true       # use every eligible woman, not just the targets
  max_per_stratum: null          # cap (e.g. 5000) to bound compute; null = no cap

splits:
  scheme: site_and_time          # site_and_time | random_patient
  test_fraction: 0.15
  val_fraction: 0.15
  temporal_holdout_after_day: null   # optional: index days (shifted) after this go to a temporal test set
  seed: 20261013

privacy:
  min_cell_size: 11              # suppress any reported count below this (MCP sets the official threshold)
  report_dir: reports            # aggregate-only outputs, safe to request for export

model:
  condition_head: multilabel     # multilabel (sigmoid, recommended) | softmax (as in the form)
  size: full                     # full (form spec) | small (smoke tests)
  freeze_imaging_backbones_epochs: 5

pretraining:
  # First-time training: there are no prior weights or Phase 1 data, so every encoder is
  # pre-trained from scratch inside MCP on women OUTSIDE the cohort's validation/test splits.
  max_women: 200000              # cap on the pool of women with cardiac evaluations
  ecg_epochs: 30                 # SimCLR on 12-lead ECGs
  echo_epochs: 30                # SimCLR on echo frames
  ehr_epochs: 20                 # masked-token modelling (15% masking)
  labs_epochs: 20                # masked-step value prediction
  batch_size: 64                 # sized for the shared A100 40 GB machines; confirm with the
                                 # 1-epoch timing run (runbook Step 5) and lower if memory runs out
